{# Shared site header — included by biozone-home.html, catalog.html,
   cart.html. Uses the same Tailwind color/spacing tokens already
   configured in catalog.html — do not rename those keys without
   updating every page's <script id="tailwind-config"> block.
   Pass `active_page` = "home" | "catalog" | "cart" from each page's
   get_context so the current section is highlighted.
   The category <select> only renders when a page passes `categories`
   (currently only catalog.py does) — safe to omit elsewhere. #}
<header class="sticky top-0 z-50 w-full shadow-sm bg-surface">
  <div class="flex justify-between items-center w-full px-md py-sm max-w-container-max mx-auto h-[72px]">
    <div class="flex-shrink-0">
      <a href="/biozone-home" class="text-2xl font-bold text-primary tracking-tight">Biozone</a>
    </div>
    <nav class="hidden md:flex gap-lg font-bold">
      <a href="/biozone-home" class="pb-1 transition-colors {% if active_page == 'home' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">الرئيسية</a>
      <a href="/catalog" class="pb-1 transition-colors {% if active_page == 'catalog' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">المتجر</a>
    </nav>
    <form method="get" action="/catalog" class="flex-grow max-w-2xl mx-lg hidden md:flex items-stretch gap-2">
      {% if categories %}
      <select name="category" onchange="this.form.submit()" class="bg-surface-container rounded-full border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm font-bold outline-none px-4 max-w-[160px] truncate">
        <option value="">الكل</option>
        {% for cat in categories %}
        <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
      {% endif %}
      <div class="relative flex-grow">
        <input class="w-full pl-10 pr-4 py-2 bg-surface-container rounded-full border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all text-base outline-none" placeholder="ابحث عن منتج..." type="text" name="q" value="{{ search_term or '' }}">
        <button type="submit" class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
    </form>
    <div class="flex items-center gap-sm">
      {% if is_logged_in %}
        <span class="hidden md:inline text-sm font-bold text-on-surface-variant">{{ user_full_name }}</span>
        <a href="/my-orders" title="طلباتي" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M3 7h11v8H3z"/><path d="M14 10h4l3 3v2h-3"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>
        </a>
        <a href="/logout" title="تسجيل خروج" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined">logout</span>
        </a>
      {% else %}
        <a href="/login" title="حسابي" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined">person</span>
        </a>
      {% endif %}
      <a href="/cart" title="السلة" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors relative flex items-center justify-center">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="absolute top-0 right-0 bg-error text-on-error text-[10px] rounded-full h-4 w-4 flex items-center justify-center" id="cart-count-badge">0</span>
      </a>
    </div>
  </div>
</header>
<script>
  // Keeps the header cart badge in sync with the client-side cart
  // (see /cart's own script for the full read/write logic and the
  // localStorage key this depends on).
  (function () {
    try {
      var items = JSON.parse(localStorage.getItem('biozone_cart_items')) || [];
      var count = items.reduce(function (sum, it) { return sum + it.quantity; }, 0);
      var badge = document.getElementById('cart-count-badge');
      if (badge) badge.textContent = count;
    } catch (e) {}
  })();
</script>
