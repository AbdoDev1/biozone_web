<div class="fixed bottom-6 inset-x-0 flex justify-center z-[60] pointer-events-none" id="cart-toast-wrap">
  <div class="hidden bg-on-surface text-surface text-sm font-bold px-5 py-3 rounded-full shadow-lg items-center gap-2 transition-opacity duration-300" id="cart-toast">
    <span class="material-symbols-outlined text-lg text-primary-fixed" id="cart-toast-icon">check_circle</span>
    <span id="cart-toast-text"></span>
  </div>
</div>
<script>
(function () {
  var cartToastTimeout;

  function store() {
    return window.BiozoneCart || null;
  }

  function showCartToast(message, isError) {
    var toast = document.getElementById('cart-toast');
    var text = document.getElementById('cart-toast-text');
    var icon = document.getElementById('cart-toast-icon');
    if (!toast || !text) return;
    text.textContent = message;
    if (icon) icon.textContent = isError ? 'error' : 'check_circle';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
    clearTimeout(cartToastTimeout);
    cartToastTimeout = setTimeout(function () {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }, 2400);
  }

  async function addToCart(itemCode, itemName, itemGroup, price, buttonEl, uom, image) {
    var api = store();
    if (!api) return;
    var original = buttonEl ? buttonEl.innerHTML : '';
    if (buttonEl) {
      buttonEl.disabled = true;
      buttonEl.innerHTML = '<span class="material-symbols-outlined text-[18px]">hourglass_top</span> جارٍ الإضافة';
    }
    try {
      await api.addItem(itemCode, 1, uom, {
        item_name: itemName,
        item_group: itemGroup,
        price: price,
        image: image
      });
      showCartToast((itemName || 'الصنف') + ' أُضيف إلى السلة');
      if (buttonEl) {
        buttonEl.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> أُضيف';
      }
    } catch (err) {
      showCartToast(err.message || 'تعذر إضافة الصنف إلى السلة', true);
      if (buttonEl) buttonEl.innerHTML = original;
    } finally {
      if (buttonEl) {
        setTimeout(function () {
          buttonEl.disabled = false;
          buttonEl.innerHTML = original;
        }, 1200);
      }
    }
  }

  function renderCatalogCartControl(el) {
    var api = store();
    if (!api) return;
    var itemCode = el.dataset.itemCode;
    var qty = api.getQty(itemCode);
    var addBtn = el.querySelector('.catalog-add-btn');
    var stepper = el.querySelector('.catalog-stepper');
    var qtyEl = el.querySelector('.catalog-qty');

    if (qty > 0) {
      if (addBtn) addBtn.classList.add('hidden');
      if (stepper) {
        stepper.classList.remove('hidden');
        stepper.classList.add('flex');
      }
      if (qtyEl) qtyEl.textContent = qty;
    } else {
      if (addBtn) addBtn.classList.remove('hidden');
      if (stepper) {
        stepper.classList.add('hidden');
        stepper.classList.remove('flex');
      }
    }
  }

  function refreshAllCatalogControls() {
    document.querySelectorAll('.catalog-cart-control').forEach(renderCatalogCartControl);
    var api = store();
    if (api) api.updateBadge();
  }

  async function changeCatalogCartQty(el, delta) {
    var api = store();
    if (!api) return;
    var itemCode = el.dataset.itemCode;
    var itemName = el.dataset.itemName;
    var itemGroup = el.dataset.itemGroup;
    var price = parseFloat(el.dataset.itemPrice) || 0;
    var uom = el.dataset.itemUom || '';
    var image = el.dataset.itemImage || '';
    var qty = api.getQty(itemCode);
    var next = qty + delta;

    try {
      if (qty === 0 && delta > 0) {
        await api.addItem(itemCode, 1, uom, {
          item_name: itemName,
          item_group: itemGroup,
          price: price,
          image: image
        });
        showCartToast((itemName || 'الصنف') + ' أُضيف إلى السلة');
      } else if (next <= 0) {
        await api.removeItem(itemCode);
      } else {
        await api.setQty(itemCode, next);
      }
    } catch (err) {
      showCartToast(err.message || 'تعذر تحديث السلة', true);
    }
    refreshAllCatalogControls();
  }

  function initCatalogCartControls() {
    document.querySelectorAll('.catalog-cart-control').forEach(function (el) {
      renderCatalogCartControl(el);
      if (el.dataset.bzCartBound === '1') return;
      el.dataset.bzCartBound = '1';
      var addBtn = el.querySelector('.catalog-add-btn');
      var incBtn = el.querySelector('.catalog-increment');
      var decBtn = el.querySelector('.catalog-decrement');
      if (addBtn) {
        addBtn.addEventListener('click', function () {
          addToCart(
            el.dataset.itemCode,
            el.dataset.itemName,
            el.dataset.itemGroup,
            parseFloat(el.dataset.itemPrice) || 0,
            addBtn,
            el.dataset.itemUom || '',
            el.dataset.itemImage || ''
          );
        });
      }
      if (incBtn) incBtn.addEventListener('click', function () { changeCatalogCartQty(el, 1); });
      if (decBtn) decBtn.addEventListener('click', function () { changeCatalogCartQty(el, -1); });
    });
  }

  window.addToCart = addToCart;
  window.showCartToast = showCartToast;
  window.renderCatalogCartControl = renderCatalogCartControl;
  window.changeCatalogCartQty = changeCatalogCartQty;
  window.initCatalogCartControls = initCatalogCartControls;
  window.refreshAllCatalogControls = refreshAllCatalogControls;

  window.addEventListener('biozone:cart-changed', refreshAllCatalogControls);
  window.addEventListener('storage', function (e) {
    if (!e) return;
    if (e.key === 'biozone_cart_items' || (e.key && e.key.indexOf('biozone_cart_items:') === 0)) {
      refreshAllCatalogControls();
    }
  });

  function start() {
    initCatalogCartControls();
    var api = store();
    if (api) api.init({ autoMergeLocalAccount: true }).then(refreshAllCatalogControls);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
