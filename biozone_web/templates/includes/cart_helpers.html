<!-- Shared "add to cart" helper. Include once near the end of any page
     with product cards that call addToCart(). Uses the same
     localStorage key/shape as /cart's own script — see cart.html for
     the full read/render logic. -->
<script>
  // سلة محلية للزائر وللحساب معًا: الزائر يضيف ويعدّل بحرية على مفتاحه
  // (BZ_GUEST_CART_KEY)، والنقل إلى سلة حسابه لا يحدث إلا بموافقته بعد
  // الدخول (public/js/guest_cart_merge.js). لا سلة خادم.
  const CART_STORAGE_KEY = window.BZ_CART_KEY;

  function showStorageError() {
    if (window.BzNotify) {
      window.BzNotify.error(
        'تعذر حفظ السلة في هذا المتصفح. تحقق من السماح بالتخزين المحلي ومن توفر مساحة، ثم حاول مجددًا.',
        { title: 'تعذر حفظ السلة', key: 'cart-storage' }
      );
    }
  }

  // Returns true only when the cart was actually persisted. The caller
  // must not update the badge/stepper or show a success toast when false.
  function persistCart(items) {
    try {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      showStorageError();
      return false;
    }
  }

  // سقف تجاري معتمد (2026-11-20): 200 صنفًا لكل سلة — مطابق لحد الخادم.
  const CART_MAX_LINES = 200;

  function addToCart(itemCode, itemName, itemGroup, price, buttonEl, uom) {
    let items = [];
    try {
      items = JSON.parse(localStorage.getItem(CART_STORAGE_KEY)) || [];
    } catch (e) {
      items = [];
    }

    const existing = items.find((it) => it.item_code === itemCode);
    if (!existing && items.length >= CART_MAX_LINES) {
      if (window.BzNotify) {
        window.BzNotify.error(
          'وصلت السلة إلى الحد الأقصى ' + CART_MAX_LINES +
            ' صنفًا. أزل بعض الأصناف قبل إضافة أصناف جديدة.',
          { title: 'السلة ممتلئة', key: 'cart-line-limit' }
        );
      }
      return;
    }
    if (existing) {
      existing.quantity += 1;
      if (uom) existing.uom = uom;
    } else {
      items.push({
        item_code: itemCode,
        item_name: itemName,
        item_group: itemGroup,
        price: price,
        image: '',
        quantity: 1,
        uom: uom || '',
      });
    }

    if (!persistCart(items)) return;

    const badge = document.getElementById('cart-count-badge');
    if (badge) {
      badge.textContent = items.reduce((sum, it) => sum + it.quantity, 0);
    }

    showCartToast(itemName + ' أُضيف إلى السلة');

    if (buttonEl) {
      const original = buttonEl.innerHTML;
      buttonEl.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> أُضيف';
      setTimeout(() => { buttonEl.innerHTML = original; }, 1200);
    }
  }

  function showCartToast(message) {
    if (window.BzNotify) {
      window.BzNotify.success(message, { title: 'تمت الإضافة' });
    }
  }

  // Stepper (+/-) controls for product cards in the store (/catalog),
  // matching the same quantity-stepper style used on the /cart page
  // itself. Each card starts as a plain "add to cart" button; once the
  // item has a quantity in the cart it switches to a live +/- stepper
  // reflecting that quantity, staying in sync with localStorage.
  function getCartItemsList() {
    if (!CART_STORAGE_KEY) return [];
    try {
      return JSON.parse(localStorage.getItem(CART_STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveCartItemsList(items) {
    if (!CART_STORAGE_KEY) return false;
    if (!persistCart(items)) return false;
    const badge = document.getElementById('cart-count-badge');
    if (badge) {
      badge.textContent = items.reduce((sum, it) => sum + it.quantity, 0);
    }
    return true;
  }

  function refreshCartBadgeFromStorage() {
    try {
      var list = CART_STORAGE_KEY
        ? (JSON.parse(localStorage.getItem(CART_STORAGE_KEY)) || [])
        : [];
      var badge = document.getElementById('cart-count-badge');
      if (badge) badge.textContent = list.reduce(function (sum, it) { return sum + (it.quantity || 0); }, 0);
    } catch (e) {}
  }

  function refreshAllCatalogControls() {
    document.querySelectorAll('.catalog-cart-control').forEach(renderCatalogCartControl);
    refreshCartBadgeFromStorage();
  }

  // البند 1: مزامنة فورية بين التبويبات — أي تغيير في مفتاح السلة
  // (إضافة/تصفير بعد طلب ناجح) يحدّث stepper الكتالوج والشارة بلا reload.
  // ملاحظة: حدث storage يُطلق في التبويبات الأخرى فقط، لا في نفس التبويب
  // الذي كتب — لذا كل كتابة محلية تحدّث واجهتها مباشرة أيضًا.
  window.addEventListener('storage', function (e) {
    if (!e || !CART_STORAGE_KEY) return;
    if (e.key === CART_STORAGE_KEY) refreshAllCatalogControls();
  });

  function renderCatalogCartControl(el) {
    const itemCode = el.dataset.itemCode;
    const items = getCartItemsList();
    const existing = items.find((it) => it.item_code === itemCode);
    const qty = existing ? existing.quantity : 0;
    const addBtn = el.querySelector('.catalog-add-btn');
    const stepper = el.querySelector('.catalog-stepper');
    const qtyEl = el.querySelector('.catalog-qty');

    if (qty > 0) {
      if (addBtn) addBtn.classList.add('hidden');
      if (stepper) {
        stepper.classList.remove('hidden');
        stepper.classList.add('flex');
      }
      if (qtyEl) qtyEl.textContent = qty;
    } else {
      if (addBtn) addBtn.classList.remove('hidden');
      if (stepper) {
        stepper.classList.add('hidden');
        stepper.classList.remove('flex');
      }
    }
  }

  function changeCatalogCartQty(el, delta) {
    const itemCode = el.dataset.itemCode;
    const itemName = el.dataset.itemName;
    const itemGroup = el.dataset.itemGroup;
    const price = parseFloat(el.dataset.itemPrice) || 0;
    const uom = el.dataset.itemUom || '';
    const image = el.dataset.itemImage || '';

    let items = getCartItemsList();
    const idx = items.findIndex((it) => it.item_code === itemCode);
    const added = idx === -1 && delta > 0;

    if (idx === -1) {
      if (delta > 0) {
        items.push({
          item_code: itemCode,
          item_name: itemName,
          item_group: itemGroup,
          price: price,
          image: image,
          quantity: 1,
          uom: uom,
        });
      }
    } else {
      items[idx].quantity += delta;
      if (uom) items[idx].uom = uom;
      if (items[idx].quantity <= 0) {
        items.splice(idx, 1);
      }
    }

    if (!saveCartItemsList(items)) {
      // Storage refused the write: keep the UI in sync with what is actually
      // persisted, and never show a success toast for a failed add.
      refreshAllCatalogControls();
      return;
    }
    refreshAllCatalogControls();
    if (added) showCartToast(itemName + ' أُضيف إلى السلة');
  }

  function initCatalogCartControls() {
    document.querySelectorAll('.catalog-cart-control').forEach((el) => {
      renderCatalogCartControl(el);

      const addBtn = el.querySelector('.catalog-add-btn');
      const incBtn = el.querySelector('.catalog-increment');
      const decBtn = el.querySelector('.catalog-decrement');

      if (addBtn) addBtn.addEventListener('click', () => changeCatalogCartQty(el, 1));
      if (incBtn) incBtn.addEventListener('click', () => changeCatalogCartQty(el, 1));
      if (decBtn) decBtn.addEventListener('click', () => changeCatalogCartQty(el, -1));
    });
  }

  document.addEventListener('DOMContentLoaded', initCatalogCartControls);
</script>
