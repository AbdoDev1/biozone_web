<!DOCTYPE html><html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>بيوزون | دخول الموظفين</title>
<link rel="icon" type="image/svg+xml" href="/assets/biozone_web/images/biozone-favicon.svg">
<link rel="stylesheet" href="/assets/biozone_web/css/app.08922a12.css">
<link rel="stylesheet" href="/assets/biozone_web/css/fonts.css">
<style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f8f9ff;
      color: #0b1c30;
      -webkit-font-smoothing: antialiased;
    }
    /* تثبيت موضع عين كلمة المرور محليًا (لا نعتمد على وجود utility classes
       في CSS المبني — بعضها غير مُولَّد في هذه الصفحة). */
    .staff-password-field { position: relative; }
    .staff-password-field input { padding-left: 2.75rem; }
    .staff-password-toggle {
      position: absolute;
      left: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      border-radius: 9999px;
      background: transparent;
      color: inherit;
      opacity: 0.45;
      cursor: pointer;
      line-height: 0;
    }
    .staff-password-toggle:hover { opacity: 0.85; }
    .staff-password-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; opacity: 0.85; }
    .staff-password-toggle svg { width: 1.25rem; height: 1.25rem; }
    .staff-password-toggle svg.hidden { display: none; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-[380px]">

    <!-- شعار بيوزون -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-2xl shrink-0 shadow-sm text-white bg-primary mb-3">B</div>
      <h1 class="text-xl font-bold text-navy-text">بيوزون</h1>
      <p class="text-sm text-navy-text/60 mt-1">دخول الموظفين</p>
    </div>

    <!-- كارت تسجيل الدخول -->
    <div class="bg-white border border-surface-container rounded-2xl p-6 sm:p-7 shadow-sm">
      <form id="staff-login-form" class="flex flex-col gap-4">

        <div>
          <label class="block text-xs font-bold text-navy-text/70 mb-1.5" for="staff-email">البريد الإلكتروني</label>
          <input
            class="w-full rounded-xl border border-surface-container bg-surface-subtle px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
            id="staff-email" name="usr" type="email" autocomplete="username" required
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-navy-text/70 mb-1.5" for="staff-password">كلمة المرور</label>
          <div class="staff-password-field">
            <input
              class="w-full rounded-xl border border-surface-container bg-surface-subtle px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
              id="staff-password" name="pwd" type="password" autocomplete="current-password" required
            >
            <button
              aria-label="إظهار كلمة المرور" aria-pressed="false"
              class="staff-password-toggle"
              id="staff-password-toggle" type="button"
            >
              <svg class="h-5 w-5" fill="none" id="staff-eye-open" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>
              </svg>
              <svg class="hidden h-5 w-5" fill="none" id="staff-eye-off" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 3l18 18"/><path d="M10.6 6.1A10.9 10.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.3 4.1"/><path d="M6.2 7.9A16.8 16.8 0 0 0 2 12s3.6 6.5 10 6.5a10.6 10.6 0 0 0 4.3-.9"/><path d="M9.9 9.9a2.6 2.6 0 0 0 3.7 3.7"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="hidden text-xs font-semibold text-alert-red bg-alert-bg rounded-lg px-3 py-2" id="staff-login-error"></p>

        <button
          class="mt-1 w-full flex items-center justify-center gap-2 rounded-full bg-primary hover:bg-primary-accent text-white font-bold text-sm py-3 shadow-sm transition-colors disabled:opacity-60"
          id="staff-login-submit" type="submit"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <span>تسجيل الدخول</span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-navy-text/45 mt-6">
      حسابات الموظفين تُنشأ بواسطة الإدارة
    </p>

  </div>

<script>
  const form = document.getElementById('staff-login-form');
  const errorEl = document.getElementById('staff-login-error');
  const submitBtn = document.getElementById('staff-login-submit');
  // رسالة فشل موحدة حرفيًا لكل حالات الدخول — بلا تمييز للسبب، وبلا عرض
  // لأي نص خادم خام (نفس نص login.html). استثناء وحيد مقصود: حد المعدل
  // (429) يُعرض بعدّاده الحقيقي — لا يكشف وجود الحساب ولا صلاحيته.
  const LOGIN_FAILED_MESSAGE = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
  const RATE_LIMITED_MESSAGE = 'تم تجاوز عدد المحاولات المسموح بها';

  function retryAfterText(value) {
    const seconds = Number(value);
    if (!isFinite(seconds) || seconds <= 0) return '';
    if (seconds < 60) return Math.ceil(seconds) + ' ثانية';
    if (seconds < 3600) return Math.ceil(seconds / 60) + ' دقيقة';
    return Math.ceil(seconds / 3600) + ' ساعة';
  }

  // عين كلمة المرور: نفس سلوك صفحة العملاء (تبديل type + أيقونة + aria).
  const pwdInput = document.getElementById('staff-password');
  const pwdToggle = document.getElementById('staff-password-toggle');
  const eyeOpen = document.getElementById('staff-eye-open');
  const eyeOff = document.getElementById('staff-eye-off');

  if (pwdToggle && pwdInput) {
    pwdToggle.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      pwdToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
      pwdToggle.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
      if (eyeOpen) eyeOpen.classList.toggle('hidden', show);
      if (eyeOff) eyeOff.classList.toggle('hidden', !show);
      try { pwdInput.focus({ preventScroll: true }); } catch (e) {}
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/method/biozone_web.api.staff_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usr: document.getElementById('staff-email').value,
          pwd: document.getElementById('staff-password').value,
        }),
      });
      const data = await res.json();
      const message = (data && data.message && typeof data.message === 'object') ? data.message : {};

      if (!res.ok) {
        if (res.status === 429) {
          const wait = retryAfterText(message.retry_after);
          const rateErr = new Error(RATE_LIMITED_MESSAGE + (wait ? '، حاول مجددًا بعد ' + wait : '، حاول لاحقًا'));
          rateErr.userMessage = true;
          throw rateErr;
        }
        // أي فشل آخر يبقى موحّدًا بلا تمييز للسبب.
        throw new Error(LOGIN_FAILED_MESSAGE);
      }

      window.location.href = (data.message && data.message.home_page) || '/staff/dashboard';
    } catch (err) {
      // نعرض فقط رسالتنا المعروفة (429 أو الموحّدة) — لا نصوص المتصفح
      // الخام مثل "Failed to fetch".
      errorEl.textContent = (err && err.userMessage) ? err.message : LOGIN_FAILED_MESSAGE;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
    }
  });
</script>

</body></html>
