<!DOCTYPE html><html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Biozone - المنتجات/title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#00685f",
        "on-primary": "#ffffff",
        "primary-container": "#008378",
        "on-primary-container": "#f4fffc",
        "surface": "#f8f9ff",
        "on-surface": "#0b1c30",
        "surface-container": "#e5eeff",
        "surface-container-low": "#eff4ff",
        "surface-container-lowest": "#ffffff",
        "surface-container-high": "#dce9ff",
        "surface-variant": "#d3e4fe",
        "on-surface-variant": "#3d4947",
        "secondary": "#5c5f61",
        "outline": "#6d7a77",
        "outline-variant": "#bcc9c6",
        "error": "#ba1a1a",
        "on-error": "#ffffff"
      },
      spacing: { lg: "24px", base: "4px", sm: "8px", md: "16px", "container-max": "1280px", gutter: "20px", xs: "4px", xl: "40px" },
      fontFamily: { title: ["Tajawal", "sans-serif"], body: ["Tajawal", "sans-serif"] }
    }
  }
}
</script>
<style>
  body { font-family: 'Tajawal', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-surface text-on-surface">

<!-- Top App Bar -->
<header class="sticky top-0 z-50 w-full shadow-sm bg-surface">
  <div class="flex flex-row-reverse justify-between items-center w-full px-md py-sm max-w-container-max mx-auto h-[72px]">
    <div class="flex-shrink-0">
<a href="/biozone-home" class="text-2xl font-bold text-primary tracking-tight">Biozone</a>
    </div>
    <form method="get" class="flex-grow max-w-2xl mx-lg hidden md:block relative">
      {% if selected_category %}<input type="hidden" name="category" value="{{ selected_category }}">{% endif %}
      <input class="w-full pl-10 pr-4 py-2 bg-surface-container rounded-full border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all text-base outline-none" placeholder="ابحث عن دواء، منتج عناية..." type="text" name="q">
      <button type="submit" class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary">
        <span class="material-symbols-outlined">search</span>
      </button>
    </form>
    <div class="flex items-center gap-sm">
      <button class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors relative">
        <span class="material-symbols-outlined">shopping_cart</span>
      </button>
    </div>
  </div>
</header>

<!-- Category Filter Bar -->
<nav class="bg-surface-container-lowest border-b border-surface-variant sticky top-[72px] z-40">
  <div class="max-w-container-max mx-auto px-md py-3 overflow-x-auto no-scrollbar">
    <ul class="flex gap-sm items-center w-max min-w-full pb-1">
      <li>
        <a href="/catalog" class="px-4 py-1.5 rounded-full font-bold whitespace-nowrap transition-colors border {% if not selected_category %}bg-primary-container text-on-primary-container border-transparent shadow-sm{% else %}bg-surface text-on-surface-variant border-outline-variant hover:bg-surface-container-high{% endif %}">الكل</a>
      </li>
      {% for cat in categories %}
      <li>
        <a href="/catalog?category={{ cat }}" class="px-4 py-1.5 rounded-full font-bold whitespace-nowrap transition-colors border {% if selected_category == cat %}bg-primary-container text-on-primary-container border-transparent shadow-sm{% else %}bg-surface text-on-surface-variant border-outline-variant hover:bg-surface-container-high{% endif %}">{{ cat }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-container-max mx-auto px-md py-lg min-h-screen">
  <div class="flex justify-between items-end mb-lg border-b border-surface-variant pb-2">
    <h1 class="text-2xl md:text-4xl font-bold text-on-surface">{{ selected_category if selected_category else "كل المنتجات" }}</h1>
    <span class="text-base text-secondary whitespace-nowrap">{{ total_count_ar }} صنف</span>
  </div>

  {% if items %}
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-md md:gap-lg">
    {% for item in items %}
    <article class="bg-surface-container-lowest rounded-xl border border-surface-variant overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.03)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 flex flex-col">
      <div class="relative w-full bg-surface-container-low flex items-center justify-center overflow-hidden aspect-[4/3]">
        <span class="text-4xl font-bold text-outline-variant">{{ item.item_name[0] }}</span>
        <span class="absolute top-2 left-2 text-[10px] text-on-surface-variant bg-surface/80 px-1.5 py-0.5 rounded">{{ item.item_code }}</span>
      </div>
      <div class="flex flex-col flex-grow p-3">
        <span class="text-xs text-primary mb-0.5 block">{{ item.item_group }}</span>
        <h3 class="font-bold text-on-surface leading-tight mb-1 line-clamp-2 min-h-[48px]">{{ item.item_name }}</h3>
        <div class="mt-auto pt-2 flex items-center justify-between">
          {% if item.price %}
          <span class="font-bold text-primary text-lg">{{ "%.2f"|format(item.price) }} ج.م</span>
          {% else %}
          <span class="text-sm text-outline">السعر غير متاح</span>
          {% endif %}
        </div>
        <button class="mt-2 w-full bg-primary hover:bg-primary-container text-on-primary font-bold rounded-lg transition-colors flex items-center justify-center gap-2 py-2 text-sm">
          <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
          أضف للسلة
        </button>
      </div>
    </article>
    {% endfor %}
  </div>
  {% else %}
  <div class="text-center py-xl text-on-surface-variant">لا يوجد أصناف </div>
  {% endif %}

  <!-- Pagination -->
  <div class="mt-xl flex justify-center items-center gap-md pb-xl">
    {% if has_prev %}
    <a href="/catalog?page={{ prev_page }}{% if selected_category %}&category={{ selected_category }}{% endif %}" class="px-6 py-3 rounded-full border border-outline text-primary font-bold hover:bg-surface-container transition-all">السابق</a>
    {% endif %}
    <span class="text-sm text-secondary">صفحة {{ page }}</span>
    {% if has_next %}
    <a href="/catalog?page={{ next_page }}{% if selected_category %}&category={{ selected_category }}{% endif %}" class="px-8 py-3 rounded-full border border-outline text-primary font-bold hover:bg-surface-container hover:border-primary transition-all flex items-center gap-2">
      التالي
      <span class="material-symbols-outlined text-[20px]">expand_more</span>
    </a>
    {% endif %}
  </div>
</main>

<!-- Footer -->
<footer class="w-full py-lg px-xl flex flex-col md:flex-row-reverse justify-between items-center max-w-container-max mx-auto border-t border-outline-variant bg-surface-container mt-auto">
<div class="text-lg font-bold text-primary mb-4 md:mb-0">Biozone</div>
  <div class="flex gap-md mb-4 md:mb-0 flex-wrap justify-center">
    <a class="text-xs text-on-surface-variant hover:text-primary underline" href="#">عن بيوزون</a>
    <a class="text-xs text-on-surface-variant hover:text-primary underline" href="#">سياسة الخصوصية</a>
    <a class="text-xs text-on-surface-variant hover:text-primary underline" href="#">الشروط والأحكام</a>
    <a class="text-xs text-on-surface-variant hover:text-primary underline" href="#">اتصل بنا</a>
  </div>
  <p class="text-sm text-on-surface-variant text-center md:text-right">جميع الحقوق محفوظة ل Biozone ٢٠٢٦</p>
</footer>

</body></html>
