<!DOCTYPE html><html dir="rtl" lang="ar" style=""><head>

{% include "templates/includes/seo_meta.html" %}
<link rel="icon" type="image/svg+xml" href="/assets/biozone_web/images/biozone-favicon.svg">
<link rel="stylesheet" href="/assets/biozone_web/css/app.08922a12.css">
<link rel="stylesheet" href="/assets/biozone_web/css/fonts.css">
<style>
        body { font-family: 'Tajawal', sans-serif; }
        .tab-active { border-bottom: 2px solid theme('colors.primary'); color: theme('colors.primary'); font-weight: 700; }
        .tab-inactive { color: theme('colors.on-surface-variant'); border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-gutter">
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-lg md:p-xl relative overflow-hidden">
<!-- Header -->
<header class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight"><a href="/biozone-home">Biozone</a></h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">بوابتك الرقمية للمستلزمات الطبية</p>
</header>
<!-- Tabs -->
<div class="flex border-b border-outline-variant/50 mb-lg">
<button class="flex-1 py-sm font-title-md text-title-md tab-active transition-colors duration-200" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
<button class="flex-1 py-sm font-title-md text-title-md tab-inactive transition-colors duration-200" id="tab-signup" onclick="switchTab('signup')">حساب جديد</button>
</div>
<!-- Forms Container -->
<div class="relative min-h-[300px]" style="height: 336px;">
<!-- Login Form -->
<form class="flex flex-col gap-md transition-opacity duration-300 absolute inset-0 w-full" id="form-login">
<p class="hidden text-sm text-error bg-error-container/40 rounded-lg px-md py-sm" id="login-error" role="alert" aria-live="assertive" aria-atomic="true"></p>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="login-email">البريد الإلكتروني</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-md pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" dir="ltr" id="login-email" placeholder="name@company.com" type="text">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="login-password">كلمة المرور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-[48px] pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" dir="ltr" id="login-password" placeholder="••••••••" type="password">
<button class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('login-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between w-full">
    <label class="flex items-center gap-sm cursor-pointer">
        <input type="checkbox" id="login-remember" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary">
        <span class="font-label-md text-label-md text-on-surface-variant">تذكرني</span>
    </label>
    <button id="forgot-btn" class="font-label-md text-label-md text-primary hover:underline disabled:opacity-60" onclick="handleForgotPassword()" type="button">نسيت كلمة المرور؟</button>
</div>
<p class="hidden text-sm text-on-surface-variant bg-surface-variant/40 rounded-lg px-md py-sm" id="forgot-message" role="status" aria-live="polite"></p>
<button id="login-submit-btn" class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md py-[14px] rounded-lg mt-sm transition-colors shadow-sm hover:shadow-md active:scale-[0.98] disabled:opacity-60" type="submit">
                    تسجيل الدخول
                </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-sm">
                    مستخدم جديد؟ <button class="text-primary font-bold hover:underline" onclick="switchTab('signup')" type="button">سجل حساب</button>
</p>
</form>
<!-- Signup Form -->
<form class="flex flex-col gap-md opacity-0 pointer-events-none transition-opacity duration-300 absolute inset-0 w-full" id="form-signup">
<p class="hidden text-sm text-error bg-error-container/40 rounded-lg px-md py-sm" id="signup-error" role="alert" aria-live="assertive" aria-atomic="true"></p>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="signup-name">الاسم الكامل</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-md pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" id="signup-name" placeholder="د. أحمد عبدالله" type="text">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="signup-email">البريد الإلكتروني</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-md pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" dir="ltr" id="signup-email" placeholder="name@company.com" type="email">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="signup-phone">رقم الهاتف</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">phone</span>
<input class="w-full pl-md pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" dir="ltr" id="signup-phone" placeholder="01X XXXX XXXX" type="tel">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="signup-password">كلمة المرور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-[48px] pr-[48px] py-[12px] bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface rounded-xl" dir="ltr" id="signup-password" placeholder="••••••••" type="password">
<button class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('signup-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button id="signup-submit-btn" class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md py-[14px] rounded-lg mt-sm transition-colors shadow-sm hover:shadow-md active:scale-[0.98] disabled:opacity-60" type="submit">
                    إنشاء حساب
                </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-sm">
                    لديك حساب بالفعل؟ <button class="text-primary font-bold hover:underline" onclick="switchTab('login')" type="button">تسجيل الدخول</button>
</p>
</form>
</div>
<!-- عودة صريحة للمتجر: تنقل ثنائي واضح دخول ↔ متجر (نفس المضيف) -->
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-md">
<a class="text-primary font-bold hover:underline" href="/biozone-home">← العودة إلى المتجر</a>
</p>
</main>
<script src="/assets/biozone_web/js/guest_cart_merge.js?v=20261121-3"></script>
<script>
        const LOGIN_RETURN_KEY = 'biozone_login_return';

        // مسار محلي فقط: لا تحويل خارجي عبر قيمة مخزّنة.
        function safeLocalPath(value) {
            if (typeof value !== 'string') return '';
            if (value.charAt(0) !== '/') return '';
            if (value.charAt(1) === '/' || value.charAt(1) === '\\') return '';
            return value;
        }

        function takeLoginReturn() {
            try {
                const value = safeLocalPath(sessionStorage.getItem(LOGIN_RETURN_KEY) || '');
                sessionStorage.removeItem(LOGIN_RETURN_KEY);
                return value;
            } catch (e) {
                return '';
            }
        }

        // بعد الدخول: العودة إلى السلة إن جاء المستخدم منها، أو إلى السلة
        // إن كانت هناك سلة زائر معلّقة لم تُنقل بعد (تُعرض معاينتها هناك).
        function postLoginTarget(email, homePage) {
            const back = takeLoginReturn();
            if (back) return back;
            try {
                if (window.BzGuestCart && window.BzGuestCart.hasPendingGuestCart(window.localStorage, email)) {
                    return '/cart';
                }
            } catch (e) {}
            return homePage || '/biozone-home';
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const container = loginForm.parentElement;

            // Stale errors from the other form must not follow the user.
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('signup-error').classList.add('hidden');
            document.getElementById('forgot-message').classList.add('hidden');

            if (tab === 'login') {
                loginTab.classList.replace('tab-inactive', 'tab-active');
                signupTab.classList.replace('tab-active', 'tab-inactive');

                signupForm.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loginForm.classList.remove('opacity-0', 'pointer-events-none');
                    container.style.height = loginForm.scrollHeight + 'px';
                }, 150);
            } else {
                signupTab.classList.replace('tab-inactive', 'tab-active');
                loginTab.classList.replace('tab-active', 'tab-inactive');

                loginForm.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    signupForm.classList.remove('opacity-0', 'pointer-events-none');
                    container.style.height = signupForm.scrollHeight + 'px';
                }, 150);
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');

            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        // Init height
        window.addEventListener('DOMContentLoaded', () => {
             const loginForm = document.getElementById('form-login');
             loginForm.parentElement.style.height = loginForm.scrollHeight + 'px';
        });

        // Recompute the sliding container's height so newly shown text
        // (error or info messages) never gets clipped or hidden.
        function recalcFormHeight(formId) {
            const form = document.getElementById(formId);
            form.parentElement.style.height = form.scrollHeight + 'px';
        }

        function showError(elId, msg) {
            const el = document.getElementById(elId);
            el.textContent = msg;
            el.classList.remove('hidden');
            const activeForm = elId === 'login-error'
                ? 'form-login'
                : 'form-signup';
            recalcFormHeight(activeForm);
        }

        function showMessage(elId, msg) {
            const el = document.getElementById(elId);
            el.textContent = msg;
            el.classList.remove('hidden');
            recalcFormHeight('form-login');
        }

        // تهدئة النقر المتكرر على "نسيت كلمة المرور" (ميزانية 3/بريد/ساعة):
        // تعطيل أثناء الإرسال، ثم تهدئة 60 ثانية بعد النجاح مع عدّاد ظاهر،
        // وإعادة فورية عند الفشل. التلميح بلا مدة صلاحية (إعداد سيرفر).
        const FORGOT_COOLDOWN_SECONDS = 60;

        function startForgotCooldown(btn) {
            const original = btn.textContent;
            let left = FORGOT_COOLDOWN_SECONDS;
            btn.disabled = true;
            btn.textContent = 'انتظر ' + left + ' ثانية قبل إعادة المحاولة';
            const timer = setInterval(() => {
                left -= 1;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = original;
                } else {
                    btn.textContent = 'انتظر ' + left + ' ثانية قبل إعادة المحاولة';
                }
            }, 1000);
        }

        async function handleForgotPassword() {
            const btn = document.getElementById('forgot-btn');
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showError('login-error', 'يرجى إدخال بريدك الإلكتروني في الحقل أعلاه أولًا، ثم الضغط على «نسيت كلمة المرور؟»');
                return;
            }
            if (btn.disabled) {
                return;
            }
            btn.disabled = true;
            try {
                const result = await callApi('biozone_forgot_password', { email });
                showMessage('forgot-message', result.message + ' إذا لم تجد الرسالة، تفقد ملف السبام.');
                startForgotCooldown(btn);
            } catch (err) {
                showError('login-error', authFailureMessage(err)
                    || 'تعذر إرسال رابط إعادة التعيين، يرجى المحاولة مرة أخرى');
                btn.disabled = false;
            }
        }

        const LOGIN_CREDENTIALS_MESSAGE = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
        const NETWORK_MESSAGE = 'تعذر الاتصال بالخدمة. تحقق من اتصالك بالإنترنت ثم حاول مجددًا.';
        const SERVICE_BUSY_MESSAGE = 'الخدمة مشغولة مؤقتًا، يرجى المحاولة بعد لحظات.';

        function retryAfterText(value) {
            const seconds = Number(value);
            if (!isFinite(seconds) || seconds <= 0) return '';
            if (seconds < 60) return Math.ceil(seconds) + ' ثانية';
            if (seconds < 3600) return Math.ceil(seconds / 60) + ' دقيقة';
            return Math.ceil(seconds / 3600) + ' ساعة';
        }

        // Only the codes this API defines for auth flows may shape the text.
        // The raw server message (if any) is never rendered: for login it is
        // uniform by design, and for signup a duplicate-email message would
        // confirm whether an address exists (account enumeration).
        function authFailureMessage(err) {
            const status = err && err.status;
            const data = (err && err.data) || {};
            const message = (data.message && typeof data.message === 'object') ? data.message : {};
            const code = typeof message.error_code === 'string' ? message.error_code : '';
            const wait = retryAfterText(message.retry_after);

            if (!status) return NETWORK_MESSAGE;
            if (status === 429) {
                if (code === 'LOGIN_BUSY') {
                    return 'الخدمة مشغولة مؤقتًا' + (wait ? '، حاول مجددًا بعد ' + wait : '، حاول بعد لحظات');
                }
                return 'تم تجاوز عدد المحاولات المسموح بها'
                    + (wait ? '، حاول مجددًا بعد ' + wait : '، حاول لاحقًا');
            }
            if (status === 503) return SERVICE_BUSY_MESSAGE;
            if (status >= 500) return 'تعذر إكمال العملية حاليًا. حاول بعد قليل.';
            return '';
        }

        async function callApi(method, payload) {
            let res;
            try {
                res = await fetch(`/api/method/biozone_web.api.${method}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                const netErr = new Error('network-failed');
                netErr.status = 0;
                throw netErr;
            }
            let data = {};
            try { data = await res.json(); } catch (e) { data = {}; }
            if (!res.ok) {
                // لا تعرض أي نص خام من الخادم (exception / _server_messages
                // قد تكشف أسماء دوال ومسارات داخلية) — كل مسار يقرر نصه من
                // allowlist أكواد الحالة/الأخطاء فقط.
                const apiErr = new Error('login-api-failed');
                apiErr.status = res.status;
                apiErr.data = data;
                throw apiErr;
            }
            return data.message;
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('login-error').classList.add('hidden');
            const emailEl = document.getElementById('login-email');
            const pwdEl = document.getElementById('login-password');
            const email = emailEl.value.trim();
            const pwd = pwdEl.value;

            if (!email) {
                showError('login-error', 'يرجى إدخال البريد الإلكتروني.');
                emailEl.focus();
                return;
            }
            if (!pwd) {
                showError('login-error', 'يرجى إدخال كلمة المرور.');
                pwdEl.focus();
                return;
            }

            const loginBtn = document.getElementById('login-submit-btn');
            loginBtn.disabled = true;
            try {
                const result = await callApi('biozone_login', {
                    usr: email,
                    pwd: pwd,
                    remember_me: document.getElementById('login-remember').checked ? 1 : 0
                });
                window.location.href = postLoginTarget(email, result.home_page);
            } catch (err) {
                loginBtn.disabled = false;
                // Wrong credentials stay uniform (no account enumeration);
                // 429/503/network keep their real meaning instead.
                showError('login-error', authFailureMessage(err) || LOGIN_CREDENTIALS_MESSAGE);
            }
        });

        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('signup-error').classList.add('hidden');
            const nameEl = document.getElementById('signup-name');
            const emailEl = document.getElementById('signup-email');
            const phoneEl = document.getElementById('signup-phone');
            const pwdEl = document.getElementById('signup-password');
            const fullName = nameEl.value.trim();
            const email = emailEl.value.trim();
            const phone = phoneEl.value.trim();
            const pwd = pwdEl.value;

            if (!fullName) {
                showError('signup-error', 'يرجى إدخال الاسم الكامل.');
                nameEl.focus();
                return;
            }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('signup-error', 'يرجى إدخال بريد إلكتروني صحيح.');
                emailEl.focus();
                return;
            }
            if (!pwd) {
                showError('signup-error', 'يرجى إدخال كلمة المرور.');
                pwdEl.focus();
                return;
            }
            if (pwd.length < 8) {
                showError('signup-error', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.');
                pwdEl.focus();
                return;
            }

            const signupBtn = document.getElementById('signup-submit-btn');
            signupBtn.disabled = true;
            try {
                const result = await callApi('biozone_sign_up', {
                    email: email,
                    full_name: fullName,
                    phone: phone,
                    pwd: pwd
                });
                window.location.href = postLoginTarget(email, result.home_page);
            } catch (err) {
                signupBtn.disabled = false;
                // Never surface "email already registered": the API text is
                // not rendered and the fallback stays non-enumerating.
                showError('signup-error', authFailureMessage(err)
                    || 'تعذر إنشاء الحساب بهذه البيانات. تحقق من صحة البريد وكلمة المرور، أو سجّل الدخول إذا كان لديك حساب بالفعل.');
            }
        });
    </script>

</body></html>
